    .stat-label { fill: #24292e; font-weight: bold; }
    .stat-dots { fill: #6a737d; }
    .stat-value { fill: #0366d6; font-weight: bold; }
    .add-color { fill: #28a745; }
    .del-color { fill: #cb2431; }
</style>

<rect width="950px" height="540px" fill="#ffffff" rx="12" stroke="#e1e4e8" stroke-width="1"/>

